name: Generate Git Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yafet-a/git-koi@main
        with:
          body: auto        # koi color follows the season
          scene: auto       # turns the pond on
          night: "true"     # also makes a dark-mode version
          size: compact     # smaller (256px)
          output-dir: koi

      - name: Commit koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif koi/koi-night.gif
          git diff --cached --quiet || (git commit -m "🐟 update koi" && git push)
